name: bronze_dengue_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-bronze-dengue"
validations:
  - batch_request:
      datasource_name: local_fixture_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: dengue_sample
      batch_spec_passthrough:
        reader_method: read_json
        reader_options:
          lines: true
    expectation_suite_name: bronze_dengue_suite
