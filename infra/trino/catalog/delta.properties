connector.name=delta_lake
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083
delta.enable-non-concurrent-writes=true
delta.register-table-procedure.enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
# svc-serving: somente leitura em gold — least-privilege para query engine
# Credenciais via ${ENV:VAR} — substituição nativa do Trino (suportado desde Trino 348)
s3.aws-access-key=${ENV:MINIO_SVC_SERVING_USER}
s3.aws-secret-key=${ENV:MINIO_SVC_SERVING_PASSWORD}
