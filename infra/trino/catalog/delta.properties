connector.name=delta_lake
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083
delta.enable-non-concurrent-writes=true
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
# Credenciais via ${ENV:VAR} — substituição nativa do Trino (suportado desde Trino 348)
# Valores definidos em .env e injetados pelo Docker Compose
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
