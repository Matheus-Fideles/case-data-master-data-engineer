# Template — NÃO contém credenciais reais.
# Aplicar via: make k8s-secrets (lê .env e faz envsubst antes de kubectl apply)
# Em produção: usar External Secrets Operator + AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: spark
type: Opaque
stringData:
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_BUCKET_LANDING: ${MINIO_BUCKET_LANDING}
  MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
  MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
  MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
