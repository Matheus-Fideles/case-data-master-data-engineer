apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: silver-vacinacao-pni-{{ ANO_MES }}
  namespace: spark
spec:
  type: Python
  mode: cluster
  image: registry.rancher.com:5000/spark-custom:3.5-delta
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/work-dir/apps/vacinal/jobs/silver_vacinacao_pni.py
  arguments:
    - --ano_mes={{ ANO_MES }}
    - --batch_id={{ BATCH_ID }}
  sparkVersion: "3.5.1"
  restartPolicy:
    type: Never
  sparkConf:
    spark.extraListeners: io.openlineage.spark.agent.OpenLineageSparkListener
    spark.openlineage.transport.type: http
    spark.openlineage.transport.url: "http://host.docker.internal:5010"
    spark.openlineage.namespace: "batch"
    spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
    spark.hadoop.fs.s3a.endpoint: http://host.docker.internal:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.sql.shuffle.partitions: "4"
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "2g"
    serviceAccount: spark
    labels: {}
    envFrom:
      - secretRef:
          name: minio-credentials
    env:
      - name: OPENLINEAGE_URL
        value: "http://host.docker.internal:5010"
      - name: OPENLINEAGE_NAMESPACE
        value: "batch"
  executor:
    cores: 1
    coreLimit: "1200m"
    instances: 1
    memory: "2g"
    labels: {}
    envFrom:
      - secretRef:
          name: minio-credentials
