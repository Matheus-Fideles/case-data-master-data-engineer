# Template — NÃO contém credenciais reais.
# Aplicar via: make k8s-secrets (lê .env e faz envsubst antes de kubectl apply)
# Em produção: usar External Secrets Operator + AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: spark
type: Opaque
stringData:
  POSTGRES_USER: ${POSTGRES_GOLD_USER}
  POSTGRES_PASSWORD: ${POSTGRES_GOLD_PASSWORD}
  POSTGRES_JDBC_URL: ${POSTGRES_JDBC_URL}
  PII_SALT: ${PII_SALT}
