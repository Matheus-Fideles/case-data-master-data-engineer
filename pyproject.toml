[project]
name = "case-data-master-data-engineer"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
quality = [
    "great-expectations==0.18.19",
    "sqlalchemy>=1.4,<2.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "bandit>=1.7",
    "great-expectations==0.18.19",
    # smoke test dependencies
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "kafka-python>=2.0",
    "confluent-kafka>=2.3",
    "faker>=25.0",
    "requests>=2.31",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "airflow", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line too long — ruff-format cuida disso
  "N812",  # lowercase imported as non-lowercase (common in PySpark)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "S101"]
"airflow/dags/**" = ["N999"]  # DAG filenames com underscores são convenção Airflow

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
markers = [
    "smoke: smoke tests end-to-end (requerem docker compose up)",
]

[tool.coverage.run]
source = ["apps"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
