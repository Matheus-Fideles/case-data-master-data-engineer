[project]
name = "case-data-master-data-engineer"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipelines", "airflow", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line too long — ruff-format cuida disso
  "N812",  # lowercase imported as non-lowercase (common in PySpark)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "S101"]
"airflow/dags/**" = ["N999"]  # DAG filenames com underscores são convenção Airflow

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
markers = [
    "smoke: smoke tests end-to-end (requerem docker compose up)",
]

[tool.coverage.run]
source = ["pipelines"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
